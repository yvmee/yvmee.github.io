summary: "Lara Liebmann is a games engineer based in Munich, Germany, with a B.Sc. and M.Sc. in Informatics: Games Engineering from the Technical University of Munich (TUM). Lara builds games end to end, from C++ gameplay in Unreal Engine to research-based educational browser games."
about:
  - "Hey there! I'm Lara, a games engineer from Munich. With a team of four I shipped *Off Course*, a 3D puzzle game, on Steam and showed it at Gamescom 2025. These days I build everything from Unreal Engine gameplay to educational browser games."
  - "I did a research exchange at The University of Tokyo on computer graphics and animation generation with diffusion models. I'm especially drawn to procedural generation, level design, human-centered design and game-based learning."
